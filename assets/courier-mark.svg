<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- BOLD vibrant background: emerald → cyan diagonal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#059669"/>
      <stop offset="50%"  stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Subtle inner sheen on top-left -->
    <radialGradient id="sheen" cx="30%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Envelope body gradient: deep dark -->
    <linearGradient id="envBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#022c1e"/>
      <stop offset="100%" stop-color="#041a2e"/>
    </linearGradient>

    <!-- Envelope border: bright white-green -->
    <linearGradient id="envBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Flap gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#022c1e"/>
      <stop offset="100%" stop-color="#033a30"/>
    </linearGradient>

    <!-- Orbit arc outer (solid request arc): white-green -->
    <linearGradient id="arcOut" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ecfdf5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Orbit arc inner (dashed response arc): white-cyan -->
    <linearGradient id="arcIn" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#cffafe" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Seal background -->
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Rim light on squircle border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#a5f3fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow for seal/dots -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow on envelope -->
    <filter id="envShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#022c1e" flood-opacity="0.55"/>
    </filter>

    <!-- Arc glow -->
    <filter id="arcGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ─── Squircle base — VIBRANT emerald-teal ─── -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Top-left glass sheen for depth -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#sheen)"/>

  <!-- ─── Orbit ring (faint) ─── -->
  <circle cx="256" cy="256" r="165"
          stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" fill="none"/>

  <!-- ─── OUTBOUND ARC — solid, bright white-green (request going out) ─── -->
  <path
    d="M 115 332 A 165 165 0 1 1 408 196"
    fill="none"
    stroke="url(#arcOut)"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#arcGlow)"
  />

  <!-- ─── INBOUND ARC — dashed, white-cyan (response coming back) ─── -->
  <path
    d="M 408 196 A 165 165 0 0 1 115 332"
    fill="none"
    stroke="url(#arcIn)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="26 16"
    filter="url(#arcGlow)"
  />

  <!-- ─── ARC ENDPOINT DOTS ─── -->
  <!-- Request tip: top-right (solid, bright) -->
  <circle cx="408" cy="196" r="9" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
  <circle cx="408" cy="196" r="4.5" fill="#d1fae5"/>

  <!-- Response tip: bottom-left (cyan tint) -->
  <circle cx="115" cy="332" r="7.5" fill="#a5f3fc" opacity="0.9" filter="url(#glow)"/>
  <circle cx="115" cy="332" r="3.5" fill="#ffffff"/>

  <!-- Arrow on request arc head -->
  <polygon points="406,178 421,197 400,203" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

  <!-- ─── ENVELOPE (dark, premium, centered) ─── -->
  <g transform="translate(256,262) rotate(-3)" filter="url(#envShadow)">

    <!-- Envelope body -->
    <rect x="-96" y="-68" width="192" height="136" rx="12"
          fill="url(#envBody)" stroke="url(#envBorder)" stroke-width="3"/>

    <!-- ── Envelope flap (top fold) ── -->
    <path d="M -96 -68 L 0 18 L 96 -68 Z"
          fill="url(#flapGrad)" stroke="url(#envBorder)" stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Flap highlight shimmer -->
    <path d="M -96 -68 L -28 -22" stroke="#d1fae5" stroke-width="1.5" opacity="0.3"/>
    <path d="M  96 -68 L  28 -22" stroke="#a5f3fc" stroke-width="1.5" opacity="0.3"/>

    <!-- Bottom fold crease lines -->
    <line x1="-96" y1="68" x2="-30" y2="12"  stroke="#1a4a30" stroke-width="1.5" opacity="0.5"/>
    <line x1=" 96" y1="68" x2=" 30" y2="12"  stroke="#164e6e" stroke-width="1.5" opacity="0.5"/>

    <!-- ── API SEAL: </> in a circle ── -->
    <!-- Outer glow ring -->
    <circle cx="0" cy="22" r="33" fill="#10b981" opacity="0.2" filter="url(#glow)"/>
    <!-- Seal background pill -->
    <circle cx="0" cy="22" r="25" fill="url(#sealBg)" stroke="#34d399" stroke-width="2"/>

    <!-- < bracket -->
    <path d="M -13 14 L -21 22 L -13 30"
          fill="none" stroke="#6ee7b7" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- / slash -->
    <line x1="3" y1="13" x2="-3" y2="31"
          stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- > bracket -->
    <path d="M 13 14 L 21 22 L 13 30"
          fill="none" stroke="#67e8f9" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- ─── Velocity sparkle particles ─── -->
  <!-- Top-right cluster -->
  <circle cx="435" cy="148" r="4"   fill="#ffffff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="455" cy="172" r="2.5" fill="#d1fae5" opacity="0.6"/>
  <circle cx="446" cy="130" r="2"   fill="#ffffff" opacity="0.4"/>
  <line   x1="438" y1="144" x2="458" y2="133"
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Bottom-left cluster -->
  <circle cx="80"  cy="366" r="3.5" fill="#a5f3fc" opacity="0.7" filter="url(#glow)"/>
  <circle cx="62"  cy="346" r="2.5" fill="#cffafe" opacity="0.5"/>
  <line   x1="76"  y1="362" x2="58" y2="373"
          stroke="#a5f3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- ─── Squircle rim highlight ─── -->
  <rect x="0" y="0" width="512" height="512" rx="108"
        fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

</svg>
